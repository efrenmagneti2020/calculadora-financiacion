<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#121212">
    <title>Calculadora de Financiación</title>
    <link rel="manifest" href="manifest.webmanifest">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 16px;
        }
        .container {
            width: 100%;
            max-width: 440px;
            background-color: #1e1e1e;
            border: 1px solid #2d2d2d;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        h1 {
            font-size: 1.25rem;
            font-weight: bold;
            text-align: center;
            margin-bottom: 20px;
            letter-spacing: 0.5px;
        }
        .grupo {
            margin-bottom: 16px;
        }
        label {
            display: block;
            font-size: 0.75rem;
            font-weight: bold;
            letter-spacing: 1px;
            color: #a1a1aa;
            margin-bottom: 6px;
        }
        .frecuencia-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        .btn-freq {
            padding: 12px;
            font-weight: bold;
            border-radius: 12px;
            border: 1px solid #3f3f46;
            background-color: #27272a;
            color: #d4d4d8;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-freq.active {
            background-color: #facc15;
            color: #000000;
            border-color: #facc15;
            box-shadow: 0 4px 12px rgba(250,204,21,0.3);
        }
        .input-box {
            display: flex;
            align-items: center;
            background-color: #27272a;
            border: 1px solid #3f3f46;
            border-radius: 12px;
            padding: 8px 12px;
        }
        .input-box span {
            color: #a1a1aa;
            font-weight: 600;
            margin-right: 8px;
            font-size: 1.1rem;
        }
        .input-box input {
            width: 100%;
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 1.1rem;
            font-weight: bold;
            outline: none;
        }
        .btn-inc {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #3f3f46;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            margin-left: 6px;
            transition: transform 0.1s;
        }
        .btn-inc:active { transform: scale(0.95); }
        .resultados {
            background-color: #121212;
            border: 1px solid #27272a;
            border-radius: 12px;
            padding: 16px;
            margin-top: 20px;
            margin-bottom: 20px;
        }
        .resultados div {
            font-size: 0.95rem;
            font-weight: 500;
            color: #f4f4f5;
            margin-bottom: 8px;
        }
        .resultados div:last-child { margin-bottom: 0; }
        .acciones-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .btn-accion {
            padding: 12px;
            font-weight: bold;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            font-size: 0.9rem;
            transition: transform 0.1s;
        }
        .btn-accion:active { transform: scale(0.95); }
        .btn-whatsapp {
            background-color: #facc15;
            color: #000000;
            box-shadow: 0 4px 12px rgba(250,204,21,0.3);
        }
        .btn-reset {
            background-color: #27272a;
            color: #d4d4d8;
            border: 1px solid #3f3f46;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Calculadora de Financiación</h1>
        
        <!-- Frecuencia -->
        <div class="grupo">
            <label>FRECUENCIA</label>
            <div class="frecuencia-grid">
                <button id="btnSemanas" onclick="setFrecuencia('semanas')" class="btn-freq active">Semanas</button>
                <button id="btnMeses" onclick="setFrecuencia('meses')" class="btn-freq">Meses</button>
            </div>
        </div>

        <!-- Importe -->
        <div class="grupo">
            <label>IMPORTE*</label>
            <div class="input-box">
                <span>$</span>
                <input type="text" id="importe" value="2.300.000" oninput="formatInputImporte(this)">
                <button onclick="modificarValor('importe', -100000)" class="btn-inc">−</button>
                <button onclick="modificarValor('importe', 100000)" class="btn-inc">+</button>
            </div>
        </div>

        <!-- Tasa -->
        <div class="grupo">
            <label id="labelTasa">TASA SEMANAL</label>
            <div class="input-box">
                <span>%</span>
                <input type="number" step="0.1" id="tasa" value="1.9" oninput="calcular()">
                <button onclick="modificarValor('tasa', -0.1)" class="btn-inc">−</button>
                <button onclick="modificarValor('tasa', 0.1)" class="btn-inc">+</button>
            </div>
        </div>

        <!-- Principio Plan -->
        <div class="grupo">
            <label id="labelPrincipio">PRINCIPIO PLAN*</label>
            <div class="input-box">
                <input type="number" id="principio" value="40" oninput="calcular()" style="margin-left: 0;">
                <button onclick="modificarValor('principio', -1)" class="btn-inc">−</button>
                <button onclick="modificarValor('principio', 1)" class="btn-inc">+</button>
            </div>
        </div>

        <!-- Intervalo -->
        <div class="grupo">
            <label>INTERVALO*</label>
            <div class="input-box">
                <input type="number" id="intervalo" value="4" oninput="calcular()" style="margin-left: 0;">
                <button onclick="modificarValor('intervalo', -1)" class="btn-inc">−</button>
                <button onclick="modificarValor('intervalo', 1)" class="btn-inc">+</button>
            </div>
        </div>

        <!-- Resultados -->
        <div class="resultados">
            <div id="resP1">P1 — 40 Semanas x $0</div>
            <div id="resP2">P2 — 44 Semanas x $0</div>
            <div id="resP3">P3 — 48 Semanas x $0</div>
        </div>

        <!-- Botones de Acción -->
        <div class="acciones-grid">
            <button onclick="copiarWhatsApp()" class="btn-accion btn-whatsapp">Copiar WhatsApp</button>
            <button onclick="restaurarValores()" class="btn-accion btn-reset">Restablecer</button>
        </div>
    </div>

    <script>
        let frecuenciaActual = 'semanas';

        function setFrecuencia(tipo, cargarDefault = true) {
            frecuenciaActual = tipo;
            const btnSemanas = document.getElementById('btnSemanas');
            const btnMeses = document.getElementById('btnMeses');
            const labelTasa = document.getElementById('labelTasa');
            const tasaInput = document.getElementById('tasa');
            const principioInput = document.getElementById('principio');

            if (tipo === 'semanas') {
                btnSemanas.classList.add('active');
                btnMeses.classList.remove('active');
                labelTasa.innerText = "TASA SEMANAL";
                if (cargarDefault) {
                    tasaInput.value = "1.9";
                    principioInput.value = "40";
                }
            } else {
                btnMeses.classList.add('active');
                btnSemanas.classList.remove('active');
                labelTasa.innerText = "TASA MENSUAL";
                if (cargarDefault) {
                    tasaInput.value = "8";
                    principioInput.value = "2";
                }
            }
            calcular();
        }

        function formatInputImporte(input) {
            let val = input.value.replace(/\D/g, '');
            if (val !== '') {
                input.value = Number(val).toLocaleString('es-AR');
            }
            calcular();
        }

        function getImporteNum() {
            let val = document.getElementById('importe').value.replace(/\./g, '').replace(/,/g, '');
            return Number(val) || 0;
        }

        function modificarValor(campo, delta) {
            if (campo === 'importe') {
                let actual = getImporteNum() + delta;
                if (actual < 0) actual = 0;
                document.getElementById('importe').value = actual.toLocaleString('es-AR');
                calcular();
            } else {
                let elem = document.getElementById(campo);
                let val = parseFloat(elem.value) || 0;
                val += delta;
                if (val < 0) val = 0;
                elem.value = Number.isInteger(delta) ? Math.round(val) : parseFloat(val.toFixed(2));
                calcular();
            }
        }

        function calcular() {
            const capital = getImporteNum();
            const tasaInput = parseFloat(document.getElementById('tasa').value) || 0;
            const principio = parseInt(document.getElementById('principio').value) || 0;
            const intervalo = parseInt(document.getElementById('intervalo').value) || 0;

            // FÓRMULA ESTRICTA: Semanal multiplica por 4 la ingresada (convención comercial), Mensual toma la tasa directa sin tocar.
            const tasaEfectiva = frecuenciaActual === 'semanas' ? tasaInput * 4 : tasaInput;

            const c1 = principio;
            const c2 = principio + intervalo;
            const c3 = principio + (intervalo * 2);

            function calcularPlan(cuotas) {
                if (capital <= 0 || cuotas <= 0) return { cuotas: 0, valorCuota: 0, total: 0 };
                let interesTotal = capital * (tasaEfectiva / 100) * cuotas;
                let totalDevolver = capital + interesTotal;
                let valorCuota = totalDevolver / cuotas;
                return { cuotas, valorCuota, total: totalDevolver };
            }

            const p1 = calcularPlan(c1);
            const p2 = calcularPlan(c2);
            const p3 = calcularPlan(c3);

            const textoFreq = frecuenciaActual === 'semanas' ? 'Semanas' : 'Meses';

            document.getElementById('resP1').innerText = `P1 — ${p1.cuotas} ${textoFreq} x $${Math.round(p1.valorCuota).toLocaleString('es-AR')}`;
            document.getElementById('resP2').innerText = `P2 — ${p2.cuotas} ${textoFreq} x $${Math.round(p2.valorCuota).toLocaleString('es-AR')}`;
            document.getElementById('resP3').innerText = `P3 — ${p3.cuotas} ${textoFreq} x $${Math.round(p3.valorCuota).toLocaleString('es-AR')}`;
            
            guardarMemoria();
        }

        function guardarMemoria() {
            const datos = {
                frecuencia: frecuenciaActual,
                importe: document.getElementById('importe').value,
                tasa: document.getElementById('tasa').value,
                principio: document.getElementById('principio').value,
                intervalo: document.getElementById('intervalo').value
            };
            localStorage.setItem('calc_financiacion_data', JSON.stringify(datos));
        }

        function cargarMemoria() {
            const guardado = localStorage.getItem('calc_financiacion_data');
            if (guardado) {
                try {
                    const datos = JSON.parse(guardado);
                    if (datos.frecuencia) {
                        setFrecuencia(datos.frecuencia, false); // Carga sin pisar valores por defecto la primera vez
                    }
                    if (datos.importe) document.getElementById('importe').value = datos.importe;
                    if (datos.tasa) document.getElementById('tasa').value = datos.tasa;
                    if (datos.principio) document.getElementById('principio').value = datos.principio;
                    if (datos.intervalo) document.getElementById('intervalo').value = datos.intervalo;
                } catch(e) {}
            }
            calcular();
        }

        function restaurarValores() {
            setFrecuencia('semanas', true);
            document.getElementById('importe').value = "2.300.000";
            document.getElementById('intervalo').value = "4";
            calcular();
        }

        function copiarWhatsApp() {
            const unidad = frecuenciaActual === 'semanas' ? 'Semanas' : 'Meses';
            const r1 = document.getElementById('resP1').innerText.split('— ')[1].replace(' Semanas', '').replace(' Meses', '');
            const r2 = document.getElementById('resP2').innerText.split('— ')[1].replace(' Semanas', '').replace(' Meses', '');
            const r3 = document.getElementById('resP3').innerText.split('— ')[1].replace(' Semanas', '').replace(' Meses', '');

            const mensaje = `*_PLANES DE FINANCIACIÓN_*\n*${r1.split(' x ')[0]} ${unidad}* x ${r1.split(' x ')[1]}\n*${r2.split(' x ')[0]} ${unidad}* x ${r2.split(' x ')[1]}\n*${r3.split(' x ')[0]} ${unidad}* x ${r3.split(' x ')[1]}`;

            navigator.clipboard.writeText(mensaje).then(() => {
                alert("¡Planes copiados al portapapeles listos para WhatsApp!");
            });
        }

        window.onload = cargarMemoria;

        // Sobrescribir el evento del botón de frecuencia para que cargue los valores por defecto al cambiar
        document.getElementById('btnSemanas').onclick = () => setFrecuencia('semanas', true);
        document.getElementById('btnMeses').onclick = () => setFrecuencia('meses', true);

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
</html>
